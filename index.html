buyc:d=>buyC(d.c,d.to),
cnew:()=>{nfImg=null;sheet(`<h2>Новый подарок / NFT</h2><div id=cpv style="text-align:center;font-size:56px;min-height:80px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:18px" data-a=cpic>${I('cam',34)}</div><button class="btn sec" data-a=cpic>Своя картинка (необязательно)</button><select id=cm>${MODELS.map((m,i)=>`<option value=${i}>3D-модель: ${m}</option>`).join('')}</select><select id=cb>${BGN.map((m,i)=>`<option value=${i}>Фон: ${m}</option>`).join('')}</select><input id=cy placeholder="Символ узора (эмодзи), например ✨" maxlength=4><input id=cn placeholder="Название (2-30 символов)" maxlength=30><input id=cp type=number inputmode=numeric placeholder="Цена в ⚡"><input id=cs type=number inputmode=numeric placeholder="Тираж (0 = без лимита)"><select id=cr>${RAR.map((r,i)=>`<option value=${i}>${r[0]}</option>`).join('')}</select><div class=er id=ce></div><button class=btn data-a=csave>Создать</button>`)},

gopt:d=>{const g=gl(ME).find(x=>x.i==d.id);if(!g)return;sheet(`${CAT[g.c]?nftView(g):''}<div class=gcard><div class=e>${CAT[g.c]?'':gart(g)}</div><b>${E(g.n)}</b><small>от ${E(U(g.f).name)}${g.p?' · ⚡ '+fmt(g.p):''}${g.no?' · #'+g.no+(g.sup?' из '+g.sup:''):''}</small></div>${shb('gpin','pin',g.pin?'Открепить':'Закрепить','data-id='+g.i)}${shb('ghid',g.hid?'eye':'eyeoff',g.hid?'Показывать в профиле':'Скрыть из профиля','data-id='+g.i)}${g.sell?shb('gunsell','x','Снять с продажи','data-id='+g.i):shb('gsell','timer','Продать на маркете','data-id='+g.i)}${shb('gex','gift','Обменять на ⚡ '+fmt(gv(g)),'data-id='+g.i)}`)},

gsell:d=>{const g=gl(ME).find(x=>x.i==d.id),v=Math.floor(+prompt('Цена в зипах',String(gv(g)*2)));if(!(v>=1&&v<=1e6))return;setG(ME.id,l=>l.map(x=>x.i==d.id?{...x,sell:v,pin:false}:x),'Выставлено на маркет')},
gex:async d=>{const g=gl(ME).find(x=>x.i==d.id);if(!g||!confirm(`Обменять «${g.n}» на ⚡ ${gv(g)}?`))return;try{await DB.doc('users/'+ME.id).update({gifts:gl(ME).filter(x=>x.i!=d.id),stars:(ME.stars||0)+gv(g)});closeS();toast('Обменяно на зипы')}catch(e){dbErr(e)}},
gbuy:async d=>{try{const sd=await DB.doc('users/'+d.u).get(),l=gl(sd.data()),g=l.find(x=>x.i==d.id);if(!g||!g.sell)return toast('Уже не продаётся');if((ME.stars||0)<g.sell)return toast('Недостаточно зипов');if(!confirm(`Купить «${g.n}» за ⚡ ${fmt(g.sell)}?`))return;await DB.doc('users/'+d.u).update({gifts:l.filter(x=>x.i!=d.id),stars:(sd.data().stars||0)+g.sell});const m=gl(ME);m.push({...g,t:Date.now(),p:g.sell,i:rnd(6),sell:0,pin:false,hid:false});await DB.doc('users/'+ME.id).update({gifts:m,stars:ME.stars-g.sell});closeS();toast('Куплено 🎁')}catch(e){dbErr(e)}},

cdec:()=>{if(!INC)return;const id=INC.id;hideInc();DB.doc('calls/'+id).update({st:'declined'}).catch(()=>{})},

try{const pc=setupPC();await pc.setRemoteDescription(x.offer);flushIce();const an=await pc.createAnswer();await pc.setLocalDescription(an);await DB.doc('calls/'+id).update({answer:{type:an.type,sdp:an.sdp},st:'active'});CALL.uDoc=DB.doc('calls/'+id).onSnapshot(d=>{if(!CALL||CALL.id!=id)return;if(!d.exists||d.data().st=='ended')endCall(false)},dbErr)}catch(e){endCall(true);dbErr(e)}},

ccam:()=>{const t=CALL?.stream.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;const b=$('[data-a=ccam]');b.innerHTML=I(t.enabled?'vid':'vidoff',26);b.classList.toggle('off',!t.enabled)},
cflip:async()=>{if(!CALL||!CALL.video)return;const old=CALL.stream.getVideoTracks()[0];CALL.fm=CALL.fm=='environment'?'user':'environment';try{old?.stop();const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:CALL.fm}}),nt=ns.getVideoTracks()[0],snd=CALL.pc.getSenders().find(s=>s.track&&s.track.kind=='video'||s.track===old);snd&&await snd.replaceTrack(nt);old&&CALL.stream.removeTrack(old);CALL.stream.addTrack(nt);const lv=$('#lv');lv.srcObject=CALL.stream;lv.style.transform=CALL.fm=='user'?'scaleX(-1)':'none'}catch{toast('Не удалось переключить камеру')}},

cseed:async()=>{if(!canMk())return;try{const ex=Object.values(CAT).map(c=>c.n);await Promise.all(SEEDS.filter(s=>!ex.includes(s[0])).map((s,i)=>DB.collection('catalog').add({n:s[0],p:s[2],sup:s[3],minted:0,img:null,m:s[1],rar:s[4],bg:s[5],pt:s[6],by:ME.id,t:Date.now()+i,nft:1})));toast('Коллекция добавлена ✨')}catch(e){dbErr(e)}},
